# Render Blueprint — این فایل هر دو سرویس (بک‌اند و فرانت‌اند) را با یک
# کلیک روی render.com می‌سازد. راهنمای کامل مراحل در README.md بخش
# «استقرار (Deployment)» آمده است.
services:
  # --- بک‌اند: FastAPI + OR-Tools، به‌صورت کانتینر داکر ---
  - type: web
    name: scheduler-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    disk:
      name: scheduler-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://scheduler-frontend.onrender.com
      - key: DATABASE_URL
        value: sqlite:////data/scheduler.db

  # --- فرانت‌اند: ساخت استاتیک React/Vite ---
  - type: web
    name: scheduler-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://scheduler-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
