# Render Blueprint — این فایل هر دو سرویس (بک‌اند و فرانت‌اند) را با یک
# کلیک روی render.com می‌سازد. راهنمای کامل مراحل در README.md بخش
# «استقرار (Deployment)» آمده است.
#
# نکته: چون سرویس‌های پلن رایگان Render دیسک دائمی و دسترسی Shell
# ندارند، از دیتابیس رایگان خودِ Render (Postgres) استفاده می‌شود
# (پایین همین فایل، بخش databases) و حساب مدیر هم با متغیر محیطی
# ساخته می‌شود، نه با اجرای دستی اسکریپت.
#
# نکته‌ی مهم درباره‌ی دیتابیس رایگان Render: این دیتابیس ۳۰ روز بعد از
# ساخته‌شدن منقضی می‌شود؛ برای ادامه‌ی کار باید قبل از آن تاریخ یکی از
# کارهای زیر را انجام دهید: (۱) آن را به یک پلن پولی ارتقا دهید، یا
# (۲) یک دیتابیس رایگان جدید بسازید و آدرسش را در Environment سرویس
# scheduler-backend جایگزین کنید (داده‌های قبلی با این روش پاک می‌شوند).
services:
  # --- بک‌اند: FastAPI + OR-Tools، به‌صورت کانتینر داکر ---
  - type: web
    name: scheduler-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://scheduler-frontend.onrender.com
      # آدرس اتصال دیتابیس به‌طور خودکار از سرویس scheduler-db (پایین
      # همین فایل) گرفته می‌شود — نیازی به وارد کردن دستی نیست.
      - key: DATABASE_URL
        fromDatabase:
          name: scheduler-db
          property: connectionString
      # اگر این دو مقدار را وارد کنید، سرویس هنگام بالا آمدن یک حساب
      # مدیر خودکار می‌سازد (چون Shell در پلن رایگان در دسترس نیست).
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

  # --- فرانت‌اند: ساخت استاتیک React/Vite ---
  - type: web
    name: scheduler-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://scheduler-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: scheduler-db
    plan: free
    databaseName: scheduler
    user: scheduler
